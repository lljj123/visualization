# 航点显示所使用的 TF 坐标系。应与 map_server 发布的地图坐标系一致。
frame_id: map

# map:   x/y 是 map 坐标系中的米制坐标（推荐）。
# pixel: u/v 是原始 PGM 图片中以左上角为原点的像素坐标。
coordinate_mode: map

# pixel 模式需要监听 OccupancyGrid，以读取地图尺寸、分辨率和原点。
map_topic: /map
marker_topic: /waypoints/markers

style:
  point_diameter: 0.30
  point_height: 0.12
  marker_z: 0.05
  text_height: 0.24
  text_z: 0.42
  line_width: 0.06
  dash_length: 0.25
  dash_gap: 0.12

# 列表第一项是起点、最后一项是终点，其余是中间点。
# map 模式只需填写 x/y；如切换到 pixel 模式，则只填写 u/v。
waypoints:
  - x: 0.0
    y: 0.0
  - x: 1.5
    y: 0.0
  - x: 1.5
    y: 1.5
